name: Upstream probe

# Daily check that this registry port still matches the latest pi-subagents
# release. A passing (upstream version, main commit) pair is cached, so the
# probe is a no-op until either side changes. A failure comments on, or opens,
# the single open issue labelled upstream-probe; the next pass closes it.

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve upstream version
        id: upstream
        run: echo "version=$(npm view pi-subagents version)" >> "$GITHUB_OUTPUT"

      # An exact hit means this version already passed on this commit. A
      # prefix hit restores the last passing runtime snapshot as the diff baseline.
      - name: Restore last passing probe
        id: gate
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .probe-pass
          key: probe-pass-${{ steps.upstream.outputs.version }}-${{ github.sha }}
          restore-keys: probe-pass-

      - name: Set up pnpm
        if: steps.gate.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Set up Node
        if: steps.gate.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The diff is informational: it is what a human reads to decide whether an
      # upstream change matters. It diffs the *runtime* entry — the file
      # "pi-subagents/background-work" resolves to through the tarball's own
      # exports, which is what test/compat.test.ts imports — together with the
      # local files that entry imports. The entry is a re-export shim, so the
      # code lives in its chunk; copying by position (01-entry.js, 02-import.js,
      # ...) keeps the diff readable when the chunk hash changes between releases.
      - name: Diff upstream against the last passing runtime snapshot
        if: steps.gate.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .probe/current .probe/base
          npm pack "pi-subagents@$VERSION" --pack-destination .probe/current
          tar -xzf .probe/current/*.tgz -C .probe/current --strip-components=1
          snapshot() {
            local root="$1" out="$2" entry dir name i n
            # Absolute path: node resolves a relative "require" argument as a module name, not a path.
            # Any condition shape: a string, or an object whose "default", "import" or "node"
            # condition (or first string value) names the file node would load.
            entry=$(node -e 'const p=require(process.argv[1]+"/package.json");const e=p.exports&&p.exports["./background-work"];const d=typeof e==="string"?e:e&&(e.default??e.import??e.node??Object.values(e).find(v=>typeof v==="string"));if(typeof d!=="string")process.exit(1);process.stdout.write(process.argv[1]+"/"+d.replace(/^\.\//,""))' "$(cd "$root" && pwd)") || {
              echo "no ./background-work export in $root" >&2
              return 1
            }
            mkdir -p "$out"
            cp "$entry" "$out/01-entry.js"
            dir=$(dirname "$entry")
            i=1
            # Both `from "./x.js"` and `import "./x.js"` (with or without the space), minified forms included.
            for name in $(grep -oE '(from|import) ?"\./[^"]+"' "$entry" | sed -E 's/^[a-z]+ ?"\.\///; s/"$//' | sort -u); do
              if [ ! -f "$dir/$name" ]; then
                echo "entry imports $name, which is not in $dir" >&2
                return 1
              fi
              i=$((i+1))
              printf -v n '%02d-import.js' "$i"
              cp "$dir/$name" "$out/$n"
            done
          }
          snapshot .probe/current .probe/current-runtime
          base=.probe-pass
          # A cache saved by an older workflow holds one file, not a snapshot of
          # the entry and its imports: treat it as absent and fall back to 0.83.0.
          if [ ! -f "$base/01-entry.js" ]; then
            npm pack pi-subagents@0.83.0 --pack-destination .probe/base
            tar -xzf .probe/base/*.tgz -C .probe/base --strip-components=1
            snapshot .probe/base .probe/base-runtime
            base=.probe/base-runtime
          fi
          diff -ru "$base" .probe/current-runtime > .probe/diff.patch || true

      # minimum-release-age=0: without it pnpm may rewrite pnpm-workspace.yaml
      # (minimumReleaseAgeExclude) for a release younger than the age gate.
      - name: Install upstream in runner
        if: steps.gate.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: pnpm add -D --ignore-scripts --config.minimum-release-age=0 "pi-subagents@$VERSION"

      - name: Compatibility suite
        if: steps.gate.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          pnpm exec vitest run test/compat.test.ts 2>&1 | tee .probe/compat.log

      - name: Record pass
        if: success() && steps.gate.outputs.cache-hit != 'true'
        run: |
          # Replaced, not merged: a snapshot left over from an older layout would
          # otherwise survive into the cache and show up as a spurious deletion.
          rm -rf .probe-pass
          mkdir -p .probe-pass
          cp -a .probe/current-runtime/. .probe-pass/

      - name: Save pass
        if: success() && steps.gate.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .probe-pass
          key: probe-pass-${{ steps.upstream.outputs.version }}-${{ github.sha }}

      - name: Upload diff and log
        if: always() && steps.gate.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-probe
          path: |
            .probe/diff.patch
            .probe/compat.log
          if-no-files-found: ignore

      - name: Open or update alarm issue
        if: failure() && steps.gate.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/probe-alarm.md"
          {
            echo "Probe run: $RUN_URL"
            echo
            echo "pi-subagents $VERSION against $GITHUB_SHA."
            echo
            echo "Compatibility log (tail):"
            tail -n 80 .probe/compat.log 2>/dev/null || echo "(no compat log: failed before the suite ran)"
            echo
            echo "Upstream diff against the last passing runtime snapshot (head):"
            head -n 200 .probe/diff.patch 2>/dev/null || echo "(no diff)"
          } > "$body"
          num=$(gh issue list --label upstream-probe --state open --json number,title --jq '.[] | select(.title | startswith("Upstream probe:")) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body"
          else
            gh label create upstream-probe --force --color B60205 --description "pi-subagents compatibility probe failure"
            gh issue create --label upstream-probe --title "Upstream probe: pi-subagents $VERSION fails" --body-file "$body"
          fi

      - name: Close alarm issue on pass
        if: success() && steps.gate.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          num=$(gh issue list --label upstream-probe --state open --json number,title --jq '.[] | select(.title | startswith("Upstream probe:")) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Probe passes for pi-subagents $VERSION on $GITHUB_SHA; closing."
            gh issue close "$num"
          fi
